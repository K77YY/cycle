name: release

# v0.2.0 のようなタグを push すると、静的リンクの Linux バイナリを
# ビルドして GitHub Release に自動で添付します。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test --locked

      - name: Build (static, x86_64)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          name="cycle-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/x86_64-unknown-linux-musl/release/cycle README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cycle-*.tar.gz
            cycle-*.tar.gz.sha256
          generate_release_notes: true
